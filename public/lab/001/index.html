<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Well — EXP-001</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0a0a; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    #back {
      position: fixed;
      top: 20px;
      left: 20px;
      font-family: 'Roboto', sans-serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      transition: color 0.2s;
    }
    #back:hover { color: rgba(255,255,255,0.75); }
    #info {
      position: fixed;
      bottom: 22px;
      left: 22px;
      font-family: 'Roboto', sans-serif;
      font-size: 10px;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.25);
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <a href="/lab" id="back">← LAB</a>
  <div id="info">EXP-001 · GRAVITY WELL · CLICK TO FLING · DRAG WELL TO MOVE</div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let W, H, well;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      if (!well) well = { x: W / 2, y: H / 2 };
    }
    resize();
    window.addEventListener('resize', resize);

    const particles = [];
    const G = 20000000;
    const SCATTER_R = 35;
    const MAX = 400;

    function spawn(x, y, n = 10) {
      for (let i = 0; i < n && particles.length < MAX; i++) {
        const dx = well.x - x;
        const dy = well.y - y;
        const d = Math.max(Math.sqrt(dx * dx + dy * dy), 50);

        // 접선 방향 속도로 발사 → 궤도 생성
        const orbV = Math.sqrt(G / d);
        const speed = orbV * (0.65 + Math.random() * 0.7);
        const dir = Math.random() < 0.5 ? 1 : -1;
        const tx = -dy / d;
        const ty = dx / d;

        particles.push({
          x, y,
          vx: tx * speed * dir,
          vy: ty * speed * dir,
          life: 1.0,
          decay: 0.001 + Math.random() * 0.002,
          r: 1.0 + Math.random() * 1.0,
        });
      }
    }

    let last = 0;

    function update(ts) {
      if (!last) last = ts;
      const dt = Math.min((ts - last) / 1000, 0.05);
      last = ts;

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        const dx = well.x - p.x;
        const dy = well.y - p.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;

        if (d < SCATTER_R) {
          p.vx -= (dx / d) * 900;
          p.vy -= (dy / d) * 900;
          p.life -= 0.18;
        } else {
          const f = G / (d * d);
          p.vx += (dx / d) * f * dt;
          p.vy += (dy / d) * f * dt;
          // 감속으로 궤도가 서서히 안쪽으로 나선형이 됨
          const damp = Math.pow(0.86, dt);
          p.vx *= damp;
          p.vy *= damp;
        }

        const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (spd > 1500) { p.vx = p.vx / spd * 1500; p.vy = p.vy / spd * 1500; }

        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= p.decay;

        if (p.life <= 0 || p.x < -150 || p.x > W + 150 || p.y < -150 || p.y > H + 150) {
          particles.splice(i, 1);
        }
      }
    }

    function draw() {
      // 페이드 오버레이 → 파티클 꼬리(별똥별 효과) 누적
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(10,10,10,0.2)';
      ctx.fillRect(0, 0, W, H);

      // 파티클: 글로우 헤일로 + 밝은 코어
      for (const p of particles) {
        ctx.globalAlpha = p.life * 0.2;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = p.life * 0.9;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // well 주변을 검정으로 덮어써서 글로우 잔상 방지
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#0a0a0a';
      ctx.beginPath();
      ctx.arc(well.x, well.y, 52, 0, Math.PI * 2);
      ctx.fill();

      // well 렌더링
      const g = ctx.createRadialGradient(well.x, well.y, 0, well.x, well.y, 38);
      g.addColorStop(0, 'rgba(255,255,255,0.14)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(well.x, well.y, 38, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(well.x, well.y, 12, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(well.x, well.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop(ts) {
      update(ts);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    let draggingWell = false;
    let pressing = false;
    let spawnTimer = null;
    let cursorPos = null;

    function hitWell(x, y) {
      const dx = x - well.x, dy = y - well.y;
      return dx * dx + dy * dy < 24 * 24;
    }

    canvas.addEventListener('pointerdown', e => {
      pressing = true;
      if (hitWell(e.clientX, e.clientY)) {
        draggingWell = true;
      } else {
        spawn(e.clientX, e.clientY, 14);
        cursorPos = { x: e.clientX, y: e.clientY };
        spawnTimer = setInterval(() => {
          if (cursorPos) spawn(cursorPos.x, cursorPos.y, 5);
        }, 80);
      }
    });

    canvas.addEventListener('pointermove', e => {
      if (!pressing) return;
      if (draggingWell) {
        well.x = e.clientX;
        well.y = e.clientY;
      } else {
        cursorPos = { x: e.clientX, y: e.clientY };
      }
    });

    canvas.addEventListener('pointerup', () => {
      pressing = false;
      draggingWell = false;
      clearInterval(spawnTimer);
      spawnTimer = null;
      cursorPos = null;
    });

    spawn(W * 0.35, H * 0.4, 25);
    spawn(W * 0.65, H * 0.6, 25);
  </script>
</body>
</html>
