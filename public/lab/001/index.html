<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Well — EXP-001</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0a0a; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    #back {
      position: fixed;
      top: 20px;
      left: 20px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      transition: color 0.2s;
    }
    #back:hover { color: rgba(255,255,255,0.75); }
    #info {
      position: fixed;
      bottom: 22px;
      left: 22px;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.25);
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <a href="/lab" id="back">← LAB</a>
  <div id="info">EXP-001 · GRAVITY WELL · CLICK TO FLING · DRAG WELL TO MOVE</div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let W, H, well;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      if (!well) well = { x: W / 2, y: H / 2 };
    }
    resize();
    window.addEventListener('resize', resize);

    const particles = [];
    const G = 9000;
    const SCATTER_R = 20;
    const MAX = 400;

    function spawn(x, y, n = 10) {
      for (let i = 0; i < n && particles.length < MAX; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 80 + Math.random() * 240;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.85 + Math.random() * 0.15,
          decay: 0.003 + Math.random() * 0.005,
          r: 1.2 + Math.random() * 1.4,
        });
      }
    }

    let last = 0;

    function update(ts) {
      if (!last) last = ts;
      const dt = Math.min((ts - last) / 1000, 0.05);
      last = ts;

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        const dx = well.x - p.x;
        const dy = well.y - p.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;

        if (d < SCATTER_R) {
          p.vx -= (dx / d) * 360;
          p.vy -= (dy / d) * 360;
          p.life -= 0.12;
        } else {
          const f = G / (d * d);
          p.vx += (dx / d) * f * dt;
          p.vy += (dy / d) * f * dt;
        }

        const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (spd > 820) { p.vx = p.vx / spd * 820; p.vy = p.vy / spd * 820; }

        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= p.decay;

        if (p.life <= 0 || p.x < -150 || p.x > W + 150 || p.y < -150 || p.y > H + 150) {
          particles.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(10,10,10,0.2)';
      ctx.fillRect(0, 0, W, H);

      for (const p of particles) {
        ctx.globalAlpha = p.life * 0.9;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;

      const g = ctx.createRadialGradient(well.x, well.y, 0, well.x, well.y, 38);
      g.addColorStop(0, 'rgba(255,255,255,0.16)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(well.x, well.y, 38, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(well.x, well.y, 12, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(well.x, well.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop(ts) {
      update(ts);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    let draggingWell = false;
    let pressing = false;
    let spawnTimer = null;
    let cursorPos = null;

    function hitWell(x, y) {
      const dx = x - well.x, dy = y - well.y;
      return dx * dx + dy * dy < 24 * 24;
    }

    canvas.addEventListener('pointerdown', e => {
      pressing = true;
      if (hitWell(e.clientX, e.clientY)) {
        draggingWell = true;
      } else {
        spawn(e.clientX, e.clientY, 14);
        cursorPos = { x: e.clientX, y: e.clientY };
        spawnTimer = setInterval(() => {
          if (cursorPos) spawn(cursorPos.x, cursorPos.y, 5);
        }, 80);
      }
    });

    canvas.addEventListener('pointermove', e => {
      if (!pressing) return;
      if (draggingWell) {
        well.x = e.clientX;
        well.y = e.clientY;
      } else {
        cursorPos = { x: e.clientX, y: e.clientY };
      }
    });

    canvas.addEventListener('pointerup', () => {
      pressing = false;
      draggingWell = false;
      clearInterval(spawnTimer);
      spawnTimer = null;
      cursorPos = null;
    });

    spawn(W * 0.35, H * 0.4, 25);
    spawn(W * 0.65, H * 0.6, 25);
  </script>
</body>
</html>
