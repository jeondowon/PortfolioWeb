<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="돈, 외모, 성격. 세 가지 중 두 가지만 고를 수 있는 작은 선택 실험." />
    <title>Pick Two · EXP-014</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        background: #000;
        color: rgba(255, 255, 255, 0.9);
        font-family: "Roboto", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header {
        position: relative;
        min-height: 64px;
        flex-shrink: 0;
      }
      #back {
        position: absolute;
        top: 20px;
        left: 20px;
        font-size: 11px;
        letter-spacing: 0.1em;
        color: rgba(255, 255, 255, 0.3);
        text-decoration: none;
        transition: color 0.2s;
      }
      #back:hover { color: rgba(255, 255, 255, 0.75); }
      #title {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.22em;
        color: rgba(255, 255, 255, 0.35);
        white-space: nowrap;
      }
      main {
        width: min(100% - 48px, 380px);
        margin: auto;
        padding: 40px 0;
      }
      .options {
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }
      .option {
        --accent: #fff;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 25px 0;
        border: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .label-input {
        flex: 1;
        min-width: 0;
        width: 100%;
        padding: 4px 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 24px;
        font-weight: 400;
        letter-spacing: -0.045em;
      }
      .toggle {
        flex-shrink: 0;
        display: grid;
        place-items: center;
        min-height: 44px;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        touch-action: manipulation;
      }
      .track {
        width: 76px;
        height: 42px;
        flex-shrink: 0;
        padding: 5px;
        border-radius: 30px;
        background: #222;
        box-shadow: inset 0 0 0 1px #ffffff08;
        transition: background 0.25s ease;
      }
      .thumb {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #777;
        color: #222;
        box-shadow: 0 2px 5px #0003;
        transition:
          transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
          background 0.25s;
      }
      .thumb::after {
        content: "";
        width: 10px;
        height: 2px;
        background: currentColor;
      }
      .toggle[aria-checked="true"] .track {
        background: var(--accent);
      }
      .toggle[aria-checked="true"] .thumb {
        transform: translateX(34px);
        background: #000;
        color: #fff;
      }
      .toggle[aria-checked="true"] .thumb::after {
        width: 10px;
        height: 6px;
        border-left: 2px solid;
        border-bottom: 2px solid;
        background: none;
        transform: translateY(-1px) rotate(-45deg);
      }
      :focus-visible {
        outline: 2px solid #fff;
        outline-offset: 6px;
        border-radius: 4px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      @media (max-width: 480px) {
        #title {
          left: auto;
          right: 20px;
          transform: none;
          letter-spacing: 0.14em;
        }
        .option {
          padding: 22px 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a id="back" href="/lab">← LAB</a>
      <h1 id="title">PICK TWO · EXP-014</h1>
    </header>
    <main>
      <div class="options" role="group" aria-labelledby="title">
        <div class="option">
          <input class="label-input" id="money-label" type="text" value="MONEY" aria-label="MONEY 항목 이름" autocomplete="off" spellcheck="false" />
          <button class="toggle" type="button" role="switch" aria-checked="false" aria-label="MONEY" data-id="money">
            <span class="track" aria-hidden="true"><span class="thumb"></span></span>
          </button>
        </div>
        <div class="option">
          <input class="label-input" id="looks-label" type="text" value="LOOKS" aria-label="LOOKS 항목 이름" autocomplete="off" spellcheck="false" />
          <button class="toggle" type="button" role="switch" aria-checked="false" aria-label="LOOKS" data-id="looks">
            <span class="track" aria-hidden="true"><span class="thumb"></span></span>
          </button>
        </div>
        <div class="option">
          <input class="label-input" id="personality-label" type="text" value="PERSONALITY" aria-label="PERSONALITY 항목 이름" autocomplete="off" spellcheck="false" />
          <button class="toggle" type="button" role="switch" aria-checked="false" aria-label="PERSONALITY" data-id="personality">
            <span class="track" aria-hidden="true"><span class="thumb"></span></span>
          </button>
        </div>
      </div>
      <p class="status sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
    <script>
      "use strict";

      const options = [...document.querySelectorAll(".toggle")];
      const status = document.querySelector(".status");
      const names = { money: "MONEY", looks: "LOOKS", personality: "PERSONALITY" };
      // Keep activation order so the oldest choice yields to the new one.
      let selected = [];

      for (const option of options) {
        const input = document.getElementById(`${option.dataset.id}-label`);
        const defaultName = input.defaultValue;
        input.addEventListener("input", () => {
          const name = input.value.trim() || defaultName;
          names[option.dataset.id] = name;
          option.setAttribute("aria-label", name);
        });
        input.addEventListener("blur", () => {
          if (!input.value.trim()) input.value = defaultName;
        });
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.isComposing) input.blur();
        });
        option.addEventListener("click", () => {
          const id = option.dataset.id;
          let removed;
          if (selected.includes(id)) {
            selected = selected.filter((item) => item !== id);
          } else {
            if (selected.length === 2) removed = selected.shift();
            selected.push(id);
          }

          // Clear the outgoing switch before turning on the incoming switch.
          for (const button of options) {
            if (!selected.includes(button.dataset.id)) button.setAttribute("aria-checked", "false");
          }
          for (const button of options) {
            if (selected.includes(button.dataset.id)) button.setAttribute("aria-checked", "true");
          }
          status.textContent = removed ? `${names[removed]} 선택 해제` : "";
        });
      }
    </script>
  </body>
</html>
