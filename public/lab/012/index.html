<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Falling Sand · EXP-012</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'Roboto', sans-serif; color: #ddd; }
    #back { position: fixed; top: 20px; left: 20px; font-size: 11px; letter-spacing: .1em; color: #ffffff4d; text-decoration: none; }
    #back:hover { color: #ffffffbf; }
    h1 { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 400; letter-spacing: .22em; color: #ffffff59; white-space: nowrap; }
    main { position: absolute; inset: 60px 24px 116px; }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; cursor: crosshair; border-bottom: 1px solid #ffffff26; }
    #brush { position: fixed; border: 1px solid #ffffff70; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); }
    #brush[hidden] { display: none; }
    .controls { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 20px; width: min(620px, calc(100% - 32px)); }
    .materials, .actions { display: flex; align-items: center; gap: 4px; }
    button { min-height: 44px; padding: 0 12px; border: 1px solid transparent; background: transparent; color: #ffffff70; font: 400 10px 'Roboto', sans-serif; letter-spacing: .12em; cursor: pointer; }
    button:hover { color: #fff; }
    button[aria-pressed="true"] { color: #fff; border-color: #ffffff30; border-radius: 3px; background: #ffffff08; }
    .swatch { display: inline-block; width: 6px; height: 6px; margin-right: 7px; border-radius: 50%; background: var(--color); }
    .size { display: flex; align-items: center; gap: 10px; font-size: 10px; letter-spacing: .12em; color: #ffffff70; }
    input { width: 70px; accent-color: #d6bb80; }
    :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    @media (max-width: 600px) {
      h1 { left: auto; right: 20px; transform: none; font-size: 10px; letter-spacing: .12em; }
      main { left: 12px; right: 12px; bottom: 140px; }
      .controls { bottom: 16px; gap: 4px 16px; }
      .materials { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <a id="back" href="/lab">← LAB</a>
  <h1>FALLING SAND · EXP-012</h1>
  <main><canvas id="sand" aria-label="Falling sand sandbox. Draw with a pointer, or use arrow keys and hold Space to draw with the selected material." tabindex="0"></canvas></main>
  <div id="brush" hidden></div>
  <div class="controls">
    <div class="materials" role="group" aria-label="Material">
      <button data-material="1" aria-pressed="true"><span class="swatch" style="--color:#d6bb80"></span>SAND</button>
      <button data-material="2" aria-pressed="false"><span class="swatch" style="--color:#5b9ac4"></span>WATER</button>
      <button data-material="3" aria-pressed="false"><span class="swatch" style="--color:#8c8c91"></span>WALL</button>
      <button data-material="0" aria-pressed="false">ERASE</button>
    </div>
    <label class="size">SIZE <input id="size" type="range" min="1" max="10" value="4"></label>
    <div class="actions">
      <button id="pause" aria-label="Pause simulation" aria-pressed="false">PAUSE</button>
      <button id="clear">CLEAR</button>
    </div>
  </div>
  <script type="module" src="./sand.js"></script>
</body>
</html>
