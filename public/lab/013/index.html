<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbit Clock — EXP-013</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    svg { display: block; }
    #back {
      position: fixed;
      top: 20px;
      left: 20px;
      font-family: 'Roboto', sans-serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      transition: color 0.2s;
    }
    #back:hover { color: rgba(255,255,255,0.75); }
    #title {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Roboto', sans-serif;
      font-size: 11px;
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.35);
      user-select: none;
    }
    text {
      font-family: 'Roboto', sans-serif;
      user-select: none;
    }
  </style>
</head>
<body>
  <svg id="clock"></svg>
  <a href="/lab" id="back">← LAB</a>
  <div id="title">ORBIT CLOCK — EXP-013</div>
<script>
"use strict";

/* ============================================================
 * Orbit Clock — EXP-013
 * Hours, minutes and seconds as three concentric rings around a
 * shared center — hours innermost, seconds outermost. Each ring
 * fills as its unit elapses (12h / 60min / 60s) and carries a
 * glowing satellite at its current position. Everything is
 * fractional, so all three rings sweep continuously.
 * ============================================================ */

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("clock");

// [hours, minutes, seconds] — inner to outer
const RING_R_F   = [0.16, 0.24, 0.32];  // radius = vmin * this
const RING_ALPHA = [0.4, 0.65, 1];      // arc brightness
const DOT_R_F    = [0.011, 0.012, 0.013];

let rings = [];     // { track, arc, dot, r }
let readout, dateEl;
let W = 0, H = 0, cx = 0, cy = 0;

function el(name, attrs) {
  const node = document.createElementNS(NS, name);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  return node;
}

function build() {
  W = window.innerWidth;
  H = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  const vmin = Math.min(W, H);

  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.textContent = "";
  rings = [];

  for (let i = 0; i < 3; i++) {
    const r = vmin * RING_R_F[i];
    const track = el("circle", {
      cx, cy, r,
      fill: "none",
      stroke: "rgba(255,255,255,0.1)",
      "stroke-width": 1,
    });
    // pathLength=100 -> dasharray works in percent of the circle.
    const arc = el("circle", {
      cx, cy, r,
      fill: "none",
      stroke: `rgba(255,255,255,${RING_ALPHA[i]})`,
      "stroke-width": Math.max(1.5, vmin * 0.004),
      "stroke-linecap": "round",
      pathLength: 100,
      "stroke-dasharray": "0 100",
      transform: `rotate(-90 ${cx} ${cy})`, // start at 12 o'clock
    });
    const dot = el("circle", {
      r: vmin * DOT_R_F[i],
      fill: "#fff",
    });
    svg.appendChild(track);
    svg.appendChild(arc);
    svg.appendChild(dot);
    rings.push({ arc, dot, r });
  }

  readout = el("text", {
    x: cx, y: cy - vmin * 0.004,
    "text-anchor": "middle",
    fill: "rgba(255,255,255,0.9)",
    "font-size": vmin * 0.052,
    "font-weight": 500,
    "letter-spacing": vmin * 0.004,
  });
  dateEl = el("text", {
    x: cx, y: cy + vmin * 0.05,
    "text-anchor": "middle",
    fill: "rgba(255,255,255,0.3)",
    "font-size": vmin * 0.018,
    "letter-spacing": vmin * 0.002,
  });
  svg.appendChild(readout);
  svg.appendChild(dateEl);
}

const pad = (n) => String(n).padStart(2, "0");
const DAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

function frame() {
  const now = new Date();
  const ms = now.getMilliseconds();
  const s = now.getSeconds() + ms / 1000;
  const m = now.getMinutes() + s / 60;
  const h = (now.getHours() % 12) + m / 60;

  const fractions = [h / 12, m / 60, s / 60]; // inner to outer

  for (let i = 0; i < 3; i++) {
    const f = fractions[i];
    const { arc, dot, r } = rings[i];
    arc.setAttribute("stroke-dasharray", `${f * 100} ${100 - f * 100}`);
    const ang = f * Math.PI * 2 - Math.PI / 2;
    dot.setAttribute("cx", cx + Math.cos(ang) * r);
    dot.setAttribute("cy", cy + Math.sin(ang) * r);
  }

  readout.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  dateEl.textContent = `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${DAYS[now.getDay()]}`;

  requestAnimationFrame(frame);
}

window.addEventListener("resize", build);
build();
requestAnimationFrame(frame);
</script>
</body>
</html>
